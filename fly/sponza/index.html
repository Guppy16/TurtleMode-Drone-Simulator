<head>

    <title>TurtleMode: Sponza (WebGPU)</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <style>
        html, body { margin: 0; height: 100%; background: #000; overflow: hidden; font: 13px/1.4 ui-monospace, Menlo, monospace; color: #fff; }
        canvas { display: block; }
        /* The HUD's look in one place: every font and colour the in-game HUD uses (timetrial.js,
           controls.js). In-world gate and path colours are GATE_COLOURS in timetrial.js. Sizes
           are in --hud-u, one 1280x720 pixel scaled to the window. The look is the Cambridge
           University Drone Society brand: Ubuntu (fonts/, Ubuntu Font Licence), near-black plates,
           cyan and sage. */
        @font-face { font-family: 'Ubuntu'; font-weight: 300; font-style: normal; font-display: block; src: url(fonts/Ubuntu-Light.ttf) format('truetype'); }
        @font-face { font-family: 'Ubuntu'; font-weight: 400; font-style: normal; font-display: block; src: url(fonts/Ubuntu-Regular.ttf) format('truetype'); }
        :root {
            --hud-u: min(calc(100vw / 1280), calc(100vh / 720));
            --hud-font: 'Ubuntu', system-ui, sans-serif;
            --hud-style: normal;
            --hud-w-light: 300; --hud-w-regular: 400;
            --hud-num: tabular-nums lining-nums;
            --hud-text: #fff;
            --hud-accent: #00d3f0;              /* cyan: the next gate, key highlights, best lap */
            --hud-quiet: #a3c1ad;               /* sage: quiet info (labels, previous best, icons) */
            --hud-keyline: #14140a;             /* near-black keylines */
            --hud-plate: rgba(20,20,10,.80);    /* plates: only the clock + delta and the lap result */
            --hud-r: calc(3 * var(--hud-u));    /* plate corner radius (and the stick gimbals') */
            --hud-div: rgba(163,193,173,.28);   /* the divider between a plate's rows */
            /* Everything else is plate-less: white type held by a near-black shadow (a 1u hairline,
               a 1u drop and a faint 7u falloff), denser for the coloured deltas. */
            --hud-shadow: 0 0 calc(1 * var(--hud-u)) rgba(20,20,10,.9), 0 calc(1 * var(--hud-u)) calc(2 * var(--hud-u)) rgba(20,20,10,.75),
                0 0 calc(7 * var(--hud-u)) rgba(20,20,10,.35);
            --hud-shadow-strong: 0 0 calc(1 * var(--hud-u)) rgba(20,20,10,.95), 0 0 calc(2 * var(--hud-u)) rgba(20,20,10,.8),
                0 calc(1 * var(--hud-u)) calc(2 * var(--hud-u)) rgba(20,20,10,.75), 0 0 calc(8 * var(--hud-u)) rgba(20,20,10,.4);
            --hud-shadow-svg: drop-shadow(0 0 1px rgba(20,20,10,.9)) drop-shadow(0 1px 2px rgba(20,20,10,.6));
            --hud-ring-shadow: rgba(20,20,10,.6); /* under the stick gimbal outline and the trail */
            /* Layout grid: screen margin, and the timing column's left edge (the clock is centred). */
            --hud-m: calc(28 * var(--hud-u));
            --hud-col: calc(50% - 62 * var(--hud-u));
            --hud-panel: rgba(20,20,10,.84);    /* the finish screen's side panel */
            --hud-dim: rgba(0,0,0,.45);         /* dims the scene behind the finish screen */
            --hud-good: #8bd74a;                /* delta: ahead */
            --hud-bad: #ff6b57;                 /* delta: behind */
            --hud-track: rgba(255,255,255,.2);
            --hud-plan-wall: rgba(163,193,173,.5);
            --hud-plan-gate: #fff;
            --hud-plan-start: #fff;
            --hud-plan-line: #fff;
            --hud-debug: rgba(255,255,255,.55);
            --hud-dim-text: rgba(255,255,255,.85); /* the fps readout */
            --hud-title-shadow: 0 1px 2px rgba(0,0,0,.75), 0 0 10px rgba(0,0,0,.45); /* the plate-less title card */
        }
        /* Plate-less readouts: fps top right (its baseline on the clock's), speed in the camera-angle
           module bottom left (controls.js #pilot-cam), and a brief toast for arm / reset / recover
           under the clock plate. */
        #hud, #spd, #toast { position: fixed; pointer-events: none; white-space: nowrap; font-family: var(--hud-font); font-style: var(--hud-style);
            font-variant-numeric: var(--hud-num); font-weight: var(--hud-w-regular); color: var(--hud-text); text-shadow: var(--hud-shadow); }
        #hud { right: var(--hud-m); top: calc(44 * var(--hud-u)); font-size: calc(16 * var(--hud-u)); line-height: calc(16 * var(--hud-u)); color: var(--hud-dim-text); }
        #hud:empty { display: none; }
        #hud.raw { right: 10px; top: auto; bottom: 8px; padding: 0; text-shadow: none; white-space: pre; color: var(--hud-debug); font: 11px/1.4 ui-monospace, Menlo, monospace; }
        #spd { left: var(--hud-m); bottom: var(--hud-m); line-height: 1; }
        #spd b { display: inline-block; min-width: 2ch; text-align: right; font-weight: inherit; font-size: calc(30 * var(--hud-u)); }
        #spd small { font-size: calc(16 * var(--hud-u)); color: var(--hud-text); margin-left: calc(5 * var(--hud-u)); }
        #toast { left: 0; right: 0; text-align: center; top: calc(132 * var(--hud-u)); font-size: calc(18 * var(--hud-u)); line-height: calc(24 * var(--hud-u));
            opacity: 0; will-change: transform, opacity; }
        #msg { position: fixed; inset: 0; display: grid; place-items: center; text-align: center; background: rgba(0,0,0,.55); white-space: pre-line; }
        #msg.hidden { display: none; }
        /* No WebGPU: a full-page note instead of the sim (see the check below). */
        #nogpu { position: fixed; inset: 0; z-index: 50; display: grid; place-items: center; padding: 24px; background: var(--hud-keyline); color: var(--hud-text);
            font: var(--hud-w-light) 16px/1.5 var(--hud-font); }
        #nogpu .card { max-width: 560px; }
        #nogpu .hd { display: flex; align-items: center; gap: 14px; }
        #nogpu .hd img { height: 44px; width: auto; }
        #nogpu h1 { margin: 0; font-weight: var(--hud-w-regular); font-size: 28px; line-height: 1.2; }
        #nogpu .why { margin: 14px 0 22px; color: var(--hud-quiet); }
        #nogpu ul { margin: 0; padding: 0; list-style: none; border-top: 1px solid rgba(163,193,173,.35); }
        #nogpu li { padding: 9px 0; border-bottom: 1px solid rgba(163,193,173,.35); }
        #nogpu b { font-weight: var(--hud-w-regular); color: var(--hud-accent); }
        #nogpu code { font-family: var(--hud-font); font-weight: var(--hud-w-regular); background: #202016; padding: 1px 6px; }
        #nogpu .note { margin-top: 18px; font-size: 13px; color: var(--hud-quiet); }
    </style>
    <!-- WebGPU check, before anything heavy: the sim's module (below, held as text) is only
         started once navigator.gpu gives a hardware adapter. Otherwise a short note on how to
         get WebGPU replaces it. No external requests; relative paths only. -->
    <script>
    window.gpuCheck = (async () => {
        let why = '', adapter = null, note = '';
        try {
            if (!navigator.gpu) why = 'This browser does not offer WebGPU (no navigator.gpu).';
            else {
                adapter = await navigator.gpu.requestAdapter({ powerPreference: 'high-performance' });
                if (!adapter) why = 'WebGPU is there, but no graphics adapter was offered (it may be blocked or disabled).';
                else {
                    const info = adapter.info || {}, desc = `${info.vendor || ''} ${info.architecture || ''} ${info.description || ''}`.toLowerCase();
                    if (adapter.isFallbackAdapter || info.isFallbackAdapter || /swiftshader|llvmpipe|software/.test(desc)) why = 'WebGPU is only running in software here (no hardware GPU), which is far too slow for the sim.';
                    if (!adapter.features.has('texture-compression-bc')) note = 'This GPU has no BC texture compression; textures load uncompressed (more memory, slower start).';
                }
            }
        } catch (e) { why = `WebGPU failed to start (${e && e.message || e}).`; }
        return { ok: !why, why, note };
    })();
    addEventListener('DOMContentLoaded', async () => {
        const r = await window.gpuCheck;
        window.gpuNote = r.note;
        if (r.ok) {
            const s = document.createElement('script'); s.type = 'module';
            s.textContent = document.getElementById('sim-src').textContent;
            document.body.appendChild(s);
            return;
        }
        document.getElementById('msg').classList.add('hidden');
        const d = document.createElement('div'); d.id = 'nogpu';
        d.innerHTML = `<div class="card"><div class="hd"><img src="brand/cuds-badge.png" alt=""><h1>This sim needs WebGPU</h1></div>
            <p class="why"></p>
            <ul>
                <li><b>Chrome or Edge</b> 113 or newer on Windows or macOS: on by default.</li>
                <li><b>Safari</b> 26 or newer: on by default, as far as we know.</li>
                <li><b>Chrome or Brave on Linux</b>: start it with <code>--enable-unsafe-webgpu --enable-features=Vulkan</code>.</li>
                <li><b>Firefox</b> 141 or newer on Windows; elsewhere, try <code>dom.webgpu.enabled</code> in about:config.</li>
            </ul>
            <p class="note">Browser support changes quickly; if it still fails, update the browser and the graphics driver.</p></div>`;
        d.querySelector('.why').textContent = r.why;
        document.body.appendChild(d);
        window.benchResult = { nogpu: r.why };
    });
    </script>
    <script type="importmap">
        {
            "imports": {
                "three": "../../vendor/three/three.webgpu.js",
                "three/webgpu": "../../vendor/three/three.webgpu.js",
                "three/tsl": "../../vendor/three/three.tsl.js",
                "three/addons/": "../../vendor/three/addons/",
                "cannon-es": "../../vendor/cannon-es/cannon-es.js",

</head>
<body>
<div id="hud"></div>
<div id="spd"><b></b><small>km/h</small></div>
<div id="toast"></div>
<div id="msg">Loading…</div>
<script type="text/plain" id="sim-src">
// Sponza atrium, flown as a tiny whoop, WebGPU only (three r187).
//
// Look: the three.js lightprobes_sponza example - a physical SunLight with cascaded shadows, a
// SkyMesh sky, and a LightProbeGrid baked from the scene at load so light bounced off the sunlit
// courtyard floor and walls fills the galleries. Flight: the simulator's own PhysicsEngine and
// InputHandler (js/physics.js, js/input.js), with a whoop preset; collision against a BVH of the
// whole model through the same callbacks the main simulator uses.
//
// URL: q=low|med|high (quality preset), scale (render scale, overrides preset), probes=0,
// shadows=0, bounces, cam=fpv|chase, uptilt (deg), fov (deg), sun=azimuth,elevation,
// mode=fly|bench (bench: scripted path, publishes window.benchResult for tools/bench).
import * as THREE from 'three/webgpu';
import { pass, mrt, output, velocity } from 'three/tsl';
import { traa } from 'three/addons/tsl/display/TRAANode.js';
import { taau } from 'three/addons/tsl/display/TAAUNode.js';
import { smaa } from 'three/addons/tsl/display/SMAANode.js';
import { fxaa } from 'three/addons/tsl/display/FXAANode.js';
import { fsr1 } from 'three/addons/tsl/display/FSR1Node.js';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { DDSLoader } from 'three/addons/loaders/DDSLoader.js';
import { SkyMesh } from 'three/addons/objects/SkyMesh.js';
import { SunLight } from 'three/addons/lights/SunLight.js';
import { SunLightNode } from 'three/addons/lights/SunLightNode.js';
import { LightProbeGrid } from 'three/addons/lighting/LightProbeGrid.js';
import { computeBoundsTree, acceleratedRaycast } from 'three-mesh-bvh';
import * as BufferGeometryUtils from 'three/addons/utils/BufferGeometryUtils.js';
import { PhysicsEngine } from '../../js/physics.js?v=36';
import { InputHandler } from '../../js/input.js?v=36';
import * as CANNON from 'cannon-es';
import { PilotUI, throttleCurve } from './controls.js';
import { AudioEngine } from '../../js/audio.js?v=36';
import { RaceManager } from '../../js/race.js?v=36';
import { formatTime } from '../../js/tracks.js?v=36';
import { SPONZA_TRACK, SPONZA_TRACK_SPAWN, withFacing, linePoints } from './track.js';
import { TimeTrial } from './timetrial.js';
import { Autopilot } from './autopilot.js';

THREE.BufferGeometry.prototype.computeBoundsTree = computeBoundsTree;
THREE.Mesh.prototype.raycast = acceleratedRaycast;

const q = new URLSearchParams(location.search);
const msg = document.getElementById('msg'), hud = document.getElementById('hud');
// Measured on the target laptop (Iris Plus G7, 1920x1200, vsync on, sustained): rendering straight
// to the canvas with a depth pre-pass and letting the compositor upscale beats the post chain
// (TRAA / FSR1 / TAAU each cost several ms per full-screen pass here): med 58 fps vs 31 with TRAA.
const PRESETS = {
    low:  { scale: 0.67, shadow: 2048, msaa: false, probes: [8, 5, 5],  cube: 16, post: 0, zpre: '1' },
    med:  { scale: 0.8,  shadow: 2048, msaa: true,  probes: [10, 7, 7], cube: 32, post: 0, zpre: '1' },
    high: { scale: 1.0,  shadow: 4096, msaa: true,  probes: [14, 8, 8], cube: 32, post: 0, zpre: '1' },
};
const preset = { ...PRESETS[q.get('q') || 'med'] };
if (q.get('scale')) preset.scale = Number(q.get('scale'));
if (q.get('taa')) preset.taa = q.get('taa') === '1';

if (!navigator.gpu) { msg.textContent = 'This map needs WebGPU.\nBrave on Linux: start it with\n--enable-unsafe-webgpu --enable-features=Vulkan'; throw new Error('no WebGPU'); }

const renderer = new THREE.WebGPURenderer({ antialias: q.get('msaa') != null ? q.get('msaa') === '1' : preset.msaa, powerPreference: 'high-performance', trackTimestamp: (q.get('mode') === 'bench' && q.get('ts') !== '0') || q.get('gpuTime') === '1' });
renderer.setPixelRatio(1);
// Bench: render at exactly ?w x ?h whatever the window is (so runs are comparable).
const W = () => Number(q.get('w') || innerWidth), H = () => Number(q.get('h') || innerHeight);
renderer.setSize(W(), H(), !q.get('w'));
// Looks: `noon` is the original (white sun, whites near clipping); `warm` is a lower, yellower
// late-afternoon sun with less exposure; `agx` is warm through AgX, which rolls highlights off
// instead of clipping them. Changing look reloads (the bounce light is baked from the sun).
const LOOKS = {
    noon: { sunI: 100, sunC: 0xfff2dc, exp: 1.0, tm: THREE.ACESFilmicToneMapping, el: 60 },
    warm: { sunI: 75, sunC: 0xffdcae, exp: 0.85, tm: THREE.ACESFilmicToneMapping, el: 60 },
    agx:  { sunI: 85, sunC: 0xffdcae, exp: 1.0, tm: THREE.AgXToneMapping, el: 60 },
};
const lookName = LOOKS[q.get('look')] ? q.get('look') : (LOOKS[localStorage.getItem('tm.look')] ? localStorage.getItem('tm.look') : 'warm');
const LOOK = LOOKS[lookName];
renderer.toneMapping = LOOK.tm;
renderer.toneMappingExposure = Number(q.get('exposure') || LOOK.exp);
renderer.shadowMap.enabled = q.get('shadows') !== '0';
document.body.prepend(renderer.domElement);
await renderer.init();
if (!renderer.backend.isWebGPUBackend) { msg.textContent = 'WebGPU adapter not available (fell back to WebGL).'; throw new Error('no WebGPU backend'); }

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(Number(q.get('fov') || 85), W() / H(), 0.01, 400);

const sky = new SkyMesh();
sky.scale.setScalar(450000);
sky.turbidity.value = 10; sky.rayleigh.value = 2; sky.mieCoefficient.value = 0.005; sky.mieDirectionalG.value = 0.8;
if (sky.cloudSpeed) sky.cloudSpeed.value = 0;
if (sky.showSunDisc) sky.showSunDisc.value = false;
scene.add(sky);

// --- Model ---
const t0 = performance.now();
const LOCAL = '../../assets/models/sponza/Sponza.gltf';
const REMOTE = 'https://raw.githubusercontent.com/KhronosGroup/glTF-Sample-Assets/main/Models/Sponza/glTF/Sponza.gltf';
const manager = new THREE.LoadingManager();
manager.onProgress = (u, a, b) => { msg.textContent = `Loading Sponza… ${a}/${b}`; };
const loader = new GLTFLoader(manager);
const haveLocal = (await fetch(LOCAL, { method: 'HEAD' }).catch(() => null))?.ok;
// GPU-compressed textures (tools/assets/dds_encode.py -> assets/models/sponza/dds/): each glTF
// texture is swapped for its DXT1/DXT5 .dds at load, before anything reaches the GPU. ~50 MB of
// texture memory instead of ~380 MB, and far less bandwidth per sample. dds=0 to compare.
const useDDS = haveLocal && q.get('dds') !== '0' && renderer.hasFeature?.('texture-compression-bc')
    && (await fetch('../../assets/models/sponza/dds/5823059166183034438.dds', { method: 'HEAD' }).catch(() => null))?.ok;
const aniso = Number(q.get('aniso') || 4);
if (useDDS) {
    const dds = new DDSLoader(manager);
    const WRAP = { 33071: THREE.ClampToEdgeWrapping, 33648: THREE.MirroredRepeatWrapping, 10497: THREE.RepeatWrapping };
    let normalTex = null;
    loader.register((parser) => ({
        name: 'dds-swap',
        loadTexture(i) {
            const json = parser.json, td = json.textures[i], uri = json.images[td.source]?.uri;
            // Normal maps stay uncompressed: BC1 (a colour format) breaks them - stray texels tilt
            // far off the surface, showing as sky-blue and black specks (e.g. under the arches).
            normalTex ??= new Set((json.materials || []).map((m) => m.normalTexture?.index).filter((x) => x !== undefined));
            if (!uri || normalTex.has(i)) return null;
            return dds.loadAsync('../../assets/models/sponza/dds/' + uri.replace(/\.\w+$/, '.dds')).then((t) => {
                const sm = json.samplers?.[td.sampler] || {};
                t.flipY = false;
                t.wrapS = WRAP[sm.wrapS ?? 10497]; t.wrapT = WRAP[sm.wrapT ?? 10497];
                t.magFilter = THREE.LinearFilter; t.minFilter = THREE.LinearMipmapLinearFilter;
                t.anisotropy = aniso;
                parser.associations.set(t, { textures: i });
                return t;
            });
        },
    }));
}
const gltf = await loader.loadAsync(haveLocal ? LOCAL : REMOTE);
const model = gltf.scene;
const lights = [];
model.traverse((o) => { if (o.isMesh) { o.castShadow = o.receiveShadow = true; } else if (o.isLight) lights.push(o); });
lights.forEach((l) => l.parent?.remove(l));
scene.add(model);
model.updateMatrixWorld(true);
const box = new THREE.Box3().setFromObject(model), size = box.getSize(new THREE.Vector3());

// --- Sun ---
const [sunAz, sunEl] = (q.get('sun') || `-75,${LOOK.el}`).split(',').map(Number);
// One directional light whose shadow map is fitted tightly round the atrium and rendered once:
// the building and the sun never move, so cascades re-rendered every frame (the example's
// SunLight) only cost time - they were the frame-time spikes. The whoop casts no shadow.
const sunDir = new THREE.Vector3().setFromSphericalCoords(1, Math.PI / 2 - THREE.MathUtils.degToRad(sunEl), THREE.MathUtils.degToRad(sunAz));
const sun = new THREE.DirectionalLight(LOOK.sunC, Number(q.get('sunI') || LOOK.sunI));
const centre = box.getCenter(new THREE.Vector3());
sun.position.copy(centre).addScaledVector(sunDir, 60); sun.target.position.copy(centre);
scene.add(sun, sun.target);
sky.sunPosition.value.copy(sunDir);
sun.castShadow = renderer.shadowMap.enabled;
if (sun.castShadow) {
    const sc = sun.shadow.camera, M = new THREE.Matrix4().lookAt(sun.position, centre, new THREE.Vector3(0, 1, 0)).setPosition(sun.position).invert();
    const fit = new THREE.Box3();
    for (let i = 0; i < 8; i++) fit.expandByPoint(new THREE.Vector3(i & 1 ? box.max.x : box.min.x, i & 2 ? box.max.y : box.min.y, i & 4 ? box.max.z : box.min.z).applyMatrix4(M));
    sc.left = fit.min.x; sc.right = fit.max.x; sc.bottom = fit.min.y; sc.top = fit.max.y; sc.near = -fit.max.z - 1; sc.far = -fit.min.z + 1;
    sc.updateProjectionMatrix();
    sun.shadow.mapSize.setScalar(preset.shadow);
    sun.shadow.bias = -0.0004; sun.shadow.normalBias = 0.02;
    sun.shadow.autoUpdate = false; sun.shadow.needsUpdate = true;
}

// --- Collision: one BVH over the whole model (every surface is solid) ---
msg.textContent = 'Building collision…';
await new Promise((r) => requestAnimationFrame(() => requestAnimationFrame(r)));
// Sponza's materials by index (glTF order): 14-19 are the hanging curtains and banners, 0 and 3
// the ivy and potted plants. Those aren't solid: cloth snags the whoop (see `snag` below) and
// leaves only drag on it. Everything else is a hard surface.
const CLOTH = new Set([14, 15, 16, 17, 18, 19]), PLANT = new Set([0, 3]);
const matIndex = (m) => gltf.parser.associations.get(m)?.materials;
const geoms = [], clothG = [], plantG = [];
model.traverse((o) => {
    if (!o.isMesh || !o.geometry.attributes.position) return;
    const mi = matIndex(o.material), list = CLOTH.has(mi) ? clothG : PLANT.has(mi) ? plantG : geoms;
    const g = new THREE.BufferGeometry();
    g.setAttribute('position', o.geometry.attributes.position.clone());
    if (o.geometry.index) g.setIndex(o.geometry.index.clone());
    g.applyMatrix4(o.matrixWorld);
    list.push(g);
});
const softBVH = (list) => { if (!list.length) return null; const m = BufferGeometryUtils.mergeGeometries(list); m.computeBoundsTree(); return m.boundsTree; };
const clothBVH = softBVH(clothG), plantBVH = softBVH(plantG);
const collGeom = BufferGeometryUtils.mergeGeometries(geoms);
geoms.forEach((g) => g.dispose());
const tb = performance.now();
collGeom.computeBoundsTree();
const bvhMs = Math.round(performance.now() - tb);
const bvh = collGeom.boundsTree;
const _p = new THREE.Vector3(), _t = {}, _ray = new THREE.Ray(), _d = new THREE.Vector3();
const hit = { closestPoint: new THREE.Vector3(), dist: 0, depth: 0, normal: new THREE.Vector3() };
const sweepHit = { point: new THREE.Vector3(), normal: new THREE.Vector3(), distance: 0 };
function checkCollision(pos, radius) {
    _p.set(pos.x, pos.y, pos.z);
    const r = bvh.closestPointToPoint(_p, _t, 0, radius);
    if (!r || r.distance >= radius) return null;
    hit.closestPoint.copy(r.point); hit.dist = r.distance; hit.depth = radius - r.distance;
    hit.normal.subVectors(_p, r.point);
    if (hit.normal.lengthSq() > 1e-8) hit.normal.normalize(); else hit.normal.set(0, 1, 0);
    return hit;
}
function sweep(from, to) {
    _ray.origin.set(from.x, from.y, from.z);
    _d.set(to.x - from.x, to.y - from.y, to.z - from.z);
    const travel = _d.length(); if (travel < 1e-6) return null;
    _ray.direction.copy(_d.multiplyScalar(1 / travel));
    const h = bvh.raycastFirst(_ray, THREE.DoubleSide);
    if (!h || h.distance > travel) return null;
    sweepHit.point.copy(h.point); sweepHit.distance = h.distance;
    if (h.face?.normal) { sweepHit.normal.copy(h.face.normal); if (sweepHit.normal.dot(_ray.direction) > 0) sweepHit.normal.negate(); }
    else sweepHit.normal.copy(_ray.direction).negate();
    return sweepHit;
}

if (q.get('mode') === 'survey') {

            if (physics._inContact && t > 1 && tt?.stage === 'racing') { contacts++; if ((autolap.hits ||= []).length < 12) { const p = physics.droneBody.position; autolap.hits.push([+t.toFixed(2), +p.x.toFixed(2), +p.y.toFixed(2), +p.z.toFixed(2)]); } }
            if (tt?.stage === 'racing' && now - autolap.lastNow > 25) autolap.long = (autolap.long || 0) + 1;
            if (tt?.stage === 'racing') { autolap.rT0 ??= now; autolap.rN = (autolap.rN || 0) + 1; autolap.rT1 = now; }
            autolap.lastNow = now;
            if (tt?.stage === 'done') autolap.doneAt ??= t;
            if (!window.benchResult && (autolap.doneAt && t > autolap.doneAt + 3 || t > Number(q.get('tEnd') || 120))) {
                window.benchResult = { mode: 'autolap', stage: tt?.stage, laps: tt?.lapTimes, holeshot: tt?.holeshot, maxErr: +(autolap.maxErr || 0).toFixed(2), contactFrames: contacts, contactAt: autolap.hits || [], snags: snagCount, t: +t.toFixed(1), fps, longFrames: autolap.long || 0, racingFps: autolap.rN > 1 ? +((autolap.rN - 1) * 1000 / (autolap.rT1 - autolap.rT0)).toFixed(1) : null,
                    hudMs: autolap.hudN ? +(autolap.hudMs / autolap.hudN).toFixed(3) : null, hudMaxMs: +(autolap.hudMax || 0).toFixed(2), pace: paceReport() };
            }
        }
        if (auto) {
            // Scripted test flight (mode=flytest): climb, hover, fly forward into the far wall.
            const t = (now - autoT0) / 1000;
            armed = t > 0.3;
            const climb = Number(q.get('climb') || 1.2);
            axes = { throttle: t < climb ? thr.inv(0.75) : t < 2.5 ? hoverT : thr.inv(hoverCmd + 0.06), yaw: 0, pitch: t > 2.5 ? -0.18 : 0, roll: 0 };
            const p = physics.droneBody.position;
            track.push([+t.toFixed(2), +p.x.toFixed(2), +p.y.toFixed(2), +p.z.toFixed(2)]);
            if (physics._inContact) contacts++;
            if (q.get('recoverAt') && t > Number(q.get('recoverAt')) && !window.recovered) {
                const before = p.toArray().map((v) => +v.toFixed(2)); recoverDrone();
                window.recovered = { t: +t.toFixed(2), before, after: physics.droneBody.position.toArray().map((v) => +v.toFixed(2)), safeN: safe.length };
            }
            if (t > Number(q.get('tEnd') || 9) && !window.benchResult) {
                const inside = box.containsPoint(new THREE.Vector3(p.x, p.y, p.z));
                const cb = clothG.length ? new THREE.Box3().setFromBufferAttribute(BufferGeometryUtils.mergeGeometries(clothG).attributes.position) : null;
                window.benchResult = { mode: 'flytest', race: RACE && { ...race.status(), stage: tt?.stage, path: window.ttPath }, sides: window.sides, recovered: window.recovered, probeBox: window.probeBox, probeMs, inside, contacts, snagged: snagCount, cloth: cb && [cb.min.toArray().map((v) => +v.toFixed(1)), cb.max.toArray().map((v) => +v.toFixed(1))], maxY: Math.max(...track.map((r) => r[2])).toFixed(2), path: track.filter((_, i) => i % 30 === 0) };
            }
        }
        // Arm changes are toasts; disarmed mid-run also stays up as a status (below).
        if (armed !== lastArmed && !(!armed && (tt?.stage === 'go' || tt?.stage === 'racing'))) toast(armed ? 'Armed' : 'Disarmed');
        const stick = axes;
        if (autolap) ui.stickAxes = stick; // the overlay shows the autopilot's sticks
        axes = { ...axes, throttle: thr.map(axes.throttle) }; // throttle curve: stick -> motor command
        physics.setInputs(axes, armed); lastArmed = armed;
        physics.step(dt);
        updateSnag(dt, now);
        trackSafe(dt);
        const hud0 = performance.now();
        tt?.update(dt, now, physics.droneBody.position, armed);
        let hudMs = performance.now() - hud0;
        syncCamera(dt);
        const hud1 = performance.now();
        tt?.draw(now);
        hudMs += performance.now() - hud1;
        if (autolap && tt?.stage === 'racing') { autolap.hudMs = (autolap.hudMs || 0) + hudMs; autolap.hudN = (autolap.hudN || 0) + 1; autolap.hudMax = Math.max(autolap.hudMax || 0, hudMs); }
        autoExposure(dt);
        if (audio.ctx) audio.update(axes, armed && !snag.hold, physics.droneBody.velocity.length(), camMode === 'fpv' ? 0 : 0.5);
        draw();
        frames++;
        drawReadouts(real);
        // Status: lasting states only (arm changes, resets and recovers are toasts): tangled, and
        // disarmed in the middle of a run.
        const racing = tt && (tt.stage === 'go' || tt.stage === 'racing');
        ui.setStatus(snag.hold ? '<span class="warn">Tangled in cloth</span>' : racing && !lastArmed ? '<span class="disarmed">Disarmed</span>' : '');
        // ?shot=<moment>@<ms> (autolap): freeze on a HUD moment for a screenshot (moments are named in
        // timetrial.js: title, countdown, go, start, g<lap>.<gate>, lap<n>, done).
        // &shotui=sticks,recover,menu adds the stick overlay, a recover 0.4 s before the shot (its
        // toast), or the open menu (paused) to the shot.
        if (shot && tt && tt.moments[shot[0]] != null && !window.benchResult) {
            const at = tt.moments[shot[0]] + shot[1];
            if (shotUi.includes('recover') && now >= at - 400 && !shot.recovered) { shot.recovered = true; recoverDrone(); }
            if (now >= at) {
                if (shotUi.includes('menu')) ui._toggle();
                renderer.setAnimationLoop(null); window.benchResult = { shot: shot.join('@'), stage: tt.stage, fps };
            }
        }
        if (REC) { recLog.frames.push([recT(), axes.throttle, axes.yaw, axes.pitch, axes.roll, armed && !snag.hold ? 1 : 0, physics.droneBody.velocity.length()]); ui._draw(); }
    };
    // fps (twice a second, top right) and speed (10 Hz, bottom left), written only on change.
    function drawReadouts(real) {
        drawToast(real);
        if (real - fpsT > 500) {
            fps = Math.round(frames * 1000 / (real - fpsT)); frames = 0; fpsT = real;
            const s = `${fps} fps`;
            if (hud.textContent !== s) hud.textContent = s;
        }
        if (real - spdT >= 100) {
            spdT = real;
            const s = String(Math.round(physics.droneBody.velocity.length() * 3.6));
            if (s !== spdTxt) { spdTxt = s; spdEl.textContent = s; }
        }
    }
    if (REC) {
        window.recStep = async () => {
            recNow += 1000 / 60; tick(recNow);
            await new Promise((r) => requestAnimationFrame(() => requestAnimationFrame(r)));
            return window.benchResult ? 1 : 0;
        };
        window.recSpeechLog = () => recLog.speech;
        window.recAudio = async () => {
            const T = recLog.frames.at(-1)[0] + 1.5, SR = 48000;
            const off = new OfflineAudioContext(2, Math.ceil(SR * T), SR);
            off.resume = () => Promise.resolve(); // the engine resumes "suspended" contexts
            const A = new AudioEngine(), Live = window.AudioContext;
            window.AudioContext = function () { return off; }; A.start(); window.AudioContext = Live;
            const sfx = recLog.sfx.slice(); let si = 0;
            const proto = TimeTrial.prototype, self = { getAudio: () => off };
            const resume = OfflineAudioContext.prototype.resume;
            const byQ = new Map();
            for (const f of recLog.frames) { const qn = Math.max(1, Math.round(f[0] * SR / 128)); if (!byQ.has(qn)) byQ.set(qn, f); }
            for (const [qn, f] of byQ) {
                off.suspend(qn * 128 / SR).then(() => {
                    A.update({ throttle: f[1], yaw: f[2], pitch: f[3], roll: f[4] }, !!f[5], f[6], 0);
                    while (si < sfx.length && sfx[si][0] <= f[0]) { const [, k, a] = sfx[si++]; proto[k].apply(self, a); }
                    return resume.call(off);
                });
            }
            const buf = await off.startRendering();
            // 16-bit PCM WAV, base64.
            const n = buf.length, L = buf.getChannelData(0), R = buf.getChannelData(1), out = new DataView(new ArrayBuffer(44 + n * 4));
            const w = (o, str) => { for (let i = 0; i < str.length; i++) out.setUint8(o + i, str.charCodeAt(i)); };
            w(0, 'RIFF'); out.setUint32(4, 36 + n * 4, true); w(8, 'WAVEfmt '); out.setUint32(16, 16, true); out.setUint16(20, 1, true); out.setUint16(22, 2, true);
            out.setUint32(24, SR, true); out.setUint32(28, SR * 4, true); out.setUint16(32, 4, true); out.setUint16(34, 16, true); w(36, 'data'); out.setUint32(40, n * 4, true);
            for (let i = 0; i < n; i++) { out.setInt16(44 + i * 4, Math.max(-1, Math.min(1, L[i])) * 32767, true); out.setInt16(46 + i * 4, Math.max(-1, Math.min(1, R[i])) * 32767, true); }
            const bytes = new Uint8Array(out.buffer); let bin = '';
            for (let i = 0; i < bytes.length; i += 0x8000) bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
            return btoa(bin);
        };
        window.recSpeak = (text) => new Promise((res) => { try { const u = new SpeechSynthesisUtterance(text); u.rate = 1.1; u.onend = u.onerror = () => res(speechSynthesis.getVoices().length); speechSynthesis.speak(u); setTimeout(() => res(-1), 8000); } catch { res(-2); } });
        window.recReady = true;
    } else renderer.setAnimationLoop(() => tick());
    window.sim = { renderer, scene, camera, physics, input, post, sun, ui, snag, tt };
}
